<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIC Links</title>
  <meta name="theme-color" content="#0c1624">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Public+Sans:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --ink:#0c2547; --paper:#ffffff; --line:rgba(244,242,237,.14); --ease:cubic-bezier(.16,1,.3,1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Public Sans", system-ui, sans-serif;
      background: var(--ink);
      color: var(--paper);
      min-height: 100svh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .profile-container { width: 100%; max-width: 520px; padding: 56px 20px 32px; display: flex; flex-direction: column; min-height: 100svh; }
    .profile-image { width: 120px; height: auto; background:#fff; padding:10px 14px; border-radius:8px; box-sizing:content-box; margin-bottom: 40px; animation: up .9s var(--ease) both; }
    .eyebrow { font-family: "Public Sans", sans-serif; font-size: 11px; font-weight: 600; color: #e0868a; animation: up .9s var(--ease) .05s both; }
    .profile-name { font-family: "Schibsted Grotesk", sans-serif; font-weight: 600; letter-spacing: -.02em; font-size: clamp(38px, 10vw, 52px); line-height: 1; margin: 14px 0 16px; animation: up .9s var(--ease) .1s both; }
    .profile-name em { color: #8fb3e6; }
    .profile-description { opacity: .7; font-weight: 300; line-height: 1.55; margin-bottom: 36px; animation: up .9s var(--ease) .15s both; }
    .social-links { border-top: 1px solid var(--line); }
    .social-links a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      overflow: hidden;
      isolation: isolate;
      animation: up .9s var(--ease) both;
      transition: color .5s var(--ease), padding .5s var(--ease);
    }
    .social-links a::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--paper);
      clip-path: inset(100% 0 0 0);
      transition: clip-path .5s var(--ease);
    }
    .social-links a:hover { color: var(--ink); padding-inline: 16px; }
    .social-links a:hover::before { clip-path: inset(0); }
    .social-links i { width: 22px; text-align: center; font-size: 18px; opacity: .85; }
    .social-links .arrow { margin-left: auto; font-size: 16px; transition: transform .5s var(--ease); }
    .social-links a:hover .arrow { transform: rotate(45deg); }
    .social-links .num { font-family: "Public Sans", sans-serif; font-size: 11px; opacity: .45; width: 20px; }
    .social-links a:nth-child(1) { animation-delay: 0.25s; }
    .social-links a:nth-child(2) { animation-delay: 0.3s; }
    .social-links a:nth-child(3) { animation-delay: 0.35s; }
    .social-links a:nth-child(4) { animation-delay: 0.4s; }
    .social-links a:nth-child(5) { animation-delay: 0.45s; }
    .social-links a:nth-child(6) { animation-delay: 0.5s; }
    .social-links a:nth-child(7) { animation-delay: 0.55s; }
        .footer { margin-top: auto; padding-top: 40px; font-size: 12px; opacity: .45; font-family: "Public Sans", sans-serif; letter-spacing: .06em; }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="profile-container">
    <img src="images/logo.webp" alt="CIC logo" class="profile-image" width="120" height="72">
    <span class="eyebrow">Erbil, Kurdistan Region</span>
    <h1 class="profile-name">Comprehensive Interventional Center</h1>
    <p class="profile-description">We specialize in advanced neurovascular and vascular therapies, enhancing patient outcomes with innovative solutions.</p>

    <nav class="social-links" aria-label="CIC links">
      <a href="https://www.instagram.com/thecicenter/" class="btn-instagram"><i class="fab fa-instagram"></i> Instagram <span class="arrow">↗</span></a>
      <a href="https://www.youtube.com/@CIC-Center" class="btn-youtube"><i class="fab fa-youtube"></i> YouTube <span class="arrow">↗</span></a>
      <a href="https://www.linkedin.com/company/ci-c/posts/?feedView=all" class="btn-linkedin"><i class="fab fa-linkedin"></i> LinkedIn <span class="arrow">↗</span></a>
      <a href="https://www.facebook.com/thecicenter/" class="btn-facebook"><i class="fab fa-facebook-f"></i> Facebook <span class="arrow">↗</span></a>
      <a href="https://www.tiktok.com/@c.i.center?_t=ZS-8vsOL96vPzb&_r=1" class="btn-tiktok"><i class="fab fa-tiktok"></i> TikTok <span class="arrow">↗</span></a>
      <a href="https://maps.app.goo.gl/FvD7tKFY3Z2ZkMwH6" class="btn-location"><i class="fas fa-location-dot"></i> Location <span class="arrow">↗</span></a>
      <a href="https://ci-c.org/" class="btn-web"><i class="fas fa-globe"></i> Website <span class="arrow">↗</span></a>
    </nav>

    <div class="footer">
      <p>Developed by <a href="https://promo-agency.co/">©Promo Agency</a></p>
    </div>
  </main>
</body>
</html>
